name: Install smoke

# Does this package build and deploy cleanly into a bare eXist? Uses the shared
# BetaMasaheft workflow: it builds the xar with ant (which runs npm install and
# the vendor copy), installs it with xst, and runs the shared bats suite
# (BetaMasaheft/.github test/install-smoke.bats) against the container logs.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  smoke:
    uses: BetaMasaheft/.github/.github/workflows/install-smoke.yml@main
